# ============================================
# APPLICATION-PROD.PROPERTIES
# Production Environment Configuration
# ============================================
# This profile is activated automatically in production via SPRING_PROFILES_ACTIVE=prod
# Supports both Render and Koyeb deployment platforms

# ============================================
# DATABASE CONFIGURATION - PRODUCTION
# ============================================
# Supports both Render (DATABASE_*) and Koyeb (SPRING_DATASOURCE_*) environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/alexia}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA & HIBERNATE CONFIGURATION
# ============================================
# 'update' creates/updates schema on first deployment, 'validate' for subsequent deployments
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERVER CONFIGURATION
# ============================================
# The application will listen on the port provided by the PORT environment variable.
# Deployment platforms set this automatically. Defaults to 8080 if not set.
server.port=${PORT:8080}

# ============================================
# VAADIN CONFIGURATION
# ============================================
# This is critical for running in a container. The vaadin-maven-plugin handles this.
vaadin.productionMode=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=WARN
logging.level.com.alexia=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================
# ACTUATOR (for Health Checks)
# ============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ============================================
# CONNECTION POOL OPTIMIZATION
# ============================================
# Disable statement caching to prevent conflicts with Supabase connection pooler
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=0
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=0

# PostgreSQL optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

